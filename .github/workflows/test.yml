name: Tests

# Type check and the test suite on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The swarm computers' root helper (connector/helper.py) can format disks: its checks are tested here.
      - run: python3 -m unittest discover -s connector -p 'test_*.py'
      # For the local swarm's desktop test (a virtual X screen shared by x11vnc).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11vnc
      - run: npm test
