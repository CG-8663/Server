name: Tailscale system app, end to end (temporary)
on:
  push:
    branches: [test/tailscale-e2e]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Root helper installed as install.sh does (sudo, root-owned), pacman stand-in
        run: |
          sudo ln -sf "$(command -v node)" /usr/bin/node
          sudo install -d -o root -g root -m 0755 /usr/local/libexec/omarchy-server
          sudo install -o root -g root -m 0755 helper/helper.mjs /usr/local/libexec/omarchy-server/helper.mjs
          sudo install -o root -g root -m 0755 e2e/pacman-shim.sh /usr/local/bin/pacman
          sudo -n /usr/local/libexec/omarchy-server/helper.mjs ping
      - name: Tailscale's apt repository (the package itself is installed by the helper)
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update -q
          if dpkg -s tailscale >/dev/null 2>&1; then echo "tailscale already installed"; exit 1; fi
      - name: Headscale (a tailnet without an account)
        run: |
          V=0.29.7
          curl -fsSL -o /tmp/headscale https://github.com/juanfont/headscale/releases/download/v$V/headscale_${V}_linux_amd64
          chmod +x /tmp/headscale
          mkdir -p /tmp/hs
          curl -fsSL https://raw.githubusercontent.com/juanfont/headscale/v$V/config-example.yaml \
            | sed -e 's#/var/lib/headscale#/tmp/hs#g' -e 's#/var/run/headscale/headscale.sock#/tmp/hs/headscale.sock#' -e 's#override_local_dns: true#override_local_dns: false#' > /tmp/hs/config.yaml
          nohup /tmp/headscale -c /tmp/hs/config.yaml serve > /tmp/hs/log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          /tmp/headscale -c /tmp/hs/config.yaml users create e2e
          ID=$(/tmp/headscale -c /tmp/hs/config.yaml users list -o json | jq -r '.[] | select(.name=="e2e") | .id')
          KEY=$(/tmp/headscale -c /tmp/hs/config.yaml preauthkeys create -u "$ID" --reusable -e 2h -o json | jq -r .key)
          test -n "$KEY"
          echo "HS_KEY=$KEY" >> "$GITHUB_ENV"
      - name: End to end
        run: node e2e/tailscale.mjs
      - name: Diagnostics
        if: always()
        run: |
          sudo journalctl -u tailscaled --no-pager -n 80 || true
          tail -n 60 /tmp/hs/log || true
          /tmp/headscale -c /tmp/hs/config.yaml nodes list || true
